<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The seven things nightshift does">
<rect width="880" height="400" rx="18" fill="#0f1330"/>
<rect x="40" y="60" width="390" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(58,80)"><circle cx="16" cy="16" r="13" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 12.5 a5 5 0 1 1 7 4.5 c-2 1 -2 2 -2 3.5" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="25" r="1.4" fill="#ffd77a"/></g>
<text x="106" y="91" fill="#ffffff" font-size="15" font-weight="600">Answers its own questions</text>
<text x="106" y="112" fill="#c3c9e8" font-size="12.5">Nobody is there, so it decides and keeps going.</text>
<rect x="450" y="60" width="390" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(468,80)"><circle cx="16" cy="18" r="12" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 18 L16 10 M12 3 H20" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="516" y="91" fill="#ffffff" font-size="15" font-weight="600">Keeps every task bounded</text>
<text x="516" y="112" fill="#c3c9e8" font-size="12.5">Steps, one check, two tries, a time limit.</text>
<rect x="40" y="148" width="390" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(58,168)"><path d="M7 9 H25 M12 9 V5 H20 V9 M9 9 L10.5 27 H21.5 L23 9" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="179" fill="#ffffff" font-size="15" font-weight="600">Cleans up after itself</text>
<text x="106" y="200" fill="#c3c9e8" font-size="12.5">Stops the servers, browsers and files it started.</text>
<rect x="450" y="148" width="390" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(468,168)"><circle cx="16" cy="16" r="13" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="7" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="16" r="1.8" fill="#ffd77a"/></g>
<text x="516" y="179" fill="#ffffff" font-size="15" font-weight="600">Holds Claude to your goal</text>
<text x="516" y="200" fill="#c3c9e8" font-size="12.5">A reviewer checks "done" against your ask.</text>
<rect x="40" y="236" width="390" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(58,256)"><path d="M16 3 L27 7 V16 C27 22 22 26 16 29 C10 26 5 22 5 16 V7 Z" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 16 L15 20 L22 12" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="267" fill="#ffffff" font-size="15" font-weight="600">Settles permission prompts</text>
<text x="106" y="288" fill="#c3c9e8" font-size="12.5">Safe steps approved, risky ones refused.</text>
<rect x="450" y="236" width="390" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(468,256)"><circle cx="16" cy="16" r="13" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 8 V16 L22 19" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="516" y="267" fill="#ffffff" font-size="15" font-weight="600">Checks in when idle</text>
<text x="516" y="288" fill="#c3c9e8" font-size="12.5">After 15 quiet minutes it asks what is stuck.</text>
<rect x="40" y="324" width="800" height="72" rx="12" fill="#1f2558" stroke="#46509a"/>
<g transform="translate(58,344)"><circle cx="16" cy="16" r="13" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 11 C18 9 12 9 12 13 C12 17 20 15 20 19 C20 23 14 23 12 21 M16 7 V9 M16 23 V25" stroke="#ffd77a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="106" y="355" fill="#ffffff" font-size="15" font-weight="600">Spends as little as possible</text>
<text x="106" y="376" fill="#c3c9e8" font-size="12.5">Free options first. Cloud GPUs at most $0.60 an hour.</text>
</svg>