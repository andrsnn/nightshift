<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93b8"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1330"/>
      <stop offset="1" stop-color="#1a1f45"/>
    </linearGradient>
  </defs>
  <rect width="880" height="560" rx="18" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="40" r="1.2"/><circle cx="210" cy="26" r="1"/><circle cx="420" cy="34" r="1.3"/>
    <circle cx="640" cy="22" r="1"/><circle cx="760" cy="48" r="1.2"/><circle cx="830" cy="90" r="1"/>
    <circle cx="30" cy="300" r="1"/><circle cx="850" cy="420" r="1.1"/><circle cx="120" cy="520" r="1"/>
  </g>
  <path d="M836 58 a26 26 0 1 1 -22 -40 a20 20 0 1 0 22 40 z" fill="#ffd77a"/>

  <text x="40" y="58" fill="#ffffff" font-size="24" font-weight="700">nightshift</text>
  <text x="40" y="82" fill="#aab2d8" font-size="14">What happens while you sleep</text>

  <!-- turn end -->
  <rect x="40" y="120" width="210" height="54" rx="10" fill="#2b3270" stroke="#5a64b8"/>
  <text x="145" y="143" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Claude ends a turn</text>
  <text x="145" y="162" fill="#aab2d8" font-size="12" text-anchor="middle">a small model reads the ending</text>

  <path d="M250 147 C 290 147, 290 130, 330 130" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M250 147 C 290 147, 290 196, 330 196" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M250 147 C 290 147, 290 262, 330 262" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M250 147 C 290 147, 290 328, 330 328" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <g font-size="13">
    <rect x="330" y="110" width="170" height="40" rx="8" fill="#1f2558" stroke="#46509a"/>
    <text x="415" y="135" fill="#fff" text-anchor="middle">asked you something</text>
    <rect x="330" y="176" width="170" height="40" rx="8" fill="#1f2558" stroke="#46509a"/>
    <text x="415" y="201" fill="#fff" text-anchor="middle">stopped with work left</text>
    <rect x="330" y="242" width="170" height="40" rx="8" fill="#1f2558" stroke="#46509a"/>
    <rect x="330" y="308" width="170" height="40" rx="8" fill="#1f2558" stroke="#46509a"/>
    <text x="415" y="267" fill="#fff" text-anchor="middle">needs a password, etc.</text>
    <text x="415" y="333" fill="#fff" text-anchor="middle">says it's done</text>
  </g>

  <g font-size="13">
    <path d="M500 130 L 556 130" stroke="#8b93b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="560" y="110" width="280" height="40" rx="8" fill="#183a3a" stroke="#3f8f86"/>
    <text x="700" y="135" fill="#d9fff8" text-anchor="middle">"Nobody will answer. Decide and go."</text>

    <path d="M500 196 L 556 196" stroke="#8b93b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="560" y="176" width="280" height="40" rx="8" fill="#183a3a" stroke="#3f8f86"/>
    <text x="700" y="201" fill="#d9fff8" text-anchor="middle">"Keep going on the goal."</text>

    <path d="M500 262 L 556 262" stroke="#8b93b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="560" y="308" width="280" height="40" rx="8" fill="#3a2d14" stroke="#c9a04a"/>
    <text x="700" y="333" fill="#ffefc8" text-anchor="middle">Strict review against your goal</text>

    <path d="M500 328 L 556 328" stroke="#8b93b8" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="560" y="242" width="280" height="40" rx="8" fill="#183a3a" stroke="#3f8f86"/>
    <text x="700" y="267" fill="#d9fff8" text-anchor="middle">"Note it, do everything else."</text>
  </g>

  <!-- review outcomes -->
  <path d="M640 348 C 640 362, 520 360, 520 372" stroke="#e07a7a" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M760 348 L 760 372" stroke="#7ad08f" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="330" y="376" width="300" height="54" rx="8" fill="#3a1a22" stroke="#c45a6a"/>
  <text x="480" y="398" fill="#ffd9de" font-size="13" text-anchor="middle" font-weight="600">FAIL: sent back with the gaps</text>
  <text x="480" y="417" fill="#e3b3bb" font-size="12" text-anchor="middle">"Look at the real output. Do all of it. Climb."</text>
  <rect x="660" y="376" width="180" height="54" rx="8" fill="#16361f" stroke="#4fae68"/>
  <text x="750" y="398" fill="#d6ffe0" font-size="13" text-anchor="middle" font-weight="600">PASS: done</text>
  <text x="750" y="417" fill="#a9dcb7" font-size="12" text-anchor="middle">check-ins pause</text>

  <!-- always on -->
  <line x1="40" y1="462" x2="840" y2="462" stroke="#39407a" stroke-dasharray="4 5"/>
  <g font-size="13">
    <rect x="40" y="480" width="250" height="56" rx="10" fill="#22285e" stroke="#46509a"/>
    <text x="165" y="503" fill="#fff" text-anchor="middle" font-weight="600">Permission prompt</text>
    <text x="165" y="522" fill="#aab2d8" font-size="12" text-anchor="middle">safe: approved · risky: refused</text>
    <rect x="315" y="480" width="250" height="56" rx="10" fill="#22285e" stroke="#46509a"/>
    <text x="440" y="503" fill="#fff" text-anchor="middle" font-weight="600">Idle for 15 minutes</text>
    <text x="440" y="522" fill="#aab2d8" font-size="12" text-anchor="middle">check in: what's stuck? carry on</text>
    <rect x="590" y="480" width="250" height="56" rx="10" fill="#22285e" stroke="#46509a"/>
    <text x="715" y="503" fill="#fff" text-anchor="middle" font-weight="600">Stuck for 30 minutes</text>
    <text x="715" y="522" fill="#aab2d8" font-size="12" text-anchor="middle">stop the turn, try another way</text>
  </g>
</svg>
