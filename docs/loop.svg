<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="You go away, Claude works, nightshift handles each stop, Claude keeps going">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93b8"/></marker>
  </defs>
  <rect width="880" height="340" rx="18" fill="#0f1330"/>
  <text x="40" y="38" fill="#ffffff" font-size="18" font-weight="700">The loop</text>
  <rect x="40" y="150" width="110" height="54" rx="10" fill="#2b3270" stroke="#5a64b8"/>
  <text x="95" y="182" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">You go away</text>
  <path d="M150 177 L 186 177" stroke="#8b93b8" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="190" y="150" width="120" height="54" rx="10" fill="#2b3270" stroke="#5a64b8"/>
  <text x="250" y="182" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Claude works</text>
  <text x="400" y="62" fill="#aab2d8" font-size="12" text-anchor="middle">It hits</text>
  <text x="730" y="62" fill="#aab2d8" font-size="12" text-anchor="middle">nightshift</text>
  <g>
    <path d="M310 177 C 340 177, 330 100, 354 100" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
    <path d="M310 177 C 335 177, 335 160, 354 160" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
    <path d="M310 177 C 335 177, 335 220, 354 220" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
    <path d="M310 177 C 340 177, 330 280, 354 280" stroke="#8b93b8" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  </g>
  <g font-size="13">
    <rect x="360" y="80" width="190" height="40" rx="8" fill="#1f2558" stroke="#46509a"/><text x="455" y="105" fill="#fff" text-anchor="middle">a question for you</text>
    <rect x="360" y="140" width="190" height="40" rx="8" fill="#1f2558" stroke="#46509a"/><text x="455" y="165" fill="#fff" text-anchor="middle">a permission prompt</text>
    <rect x="360" y="200" width="190" height="40" rx="8" fill="#1f2558" stroke="#46509a"/><text x="455" y="225" fill="#fff" text-anchor="middle">a stall</text>
    <rect x="360" y="260" width="190" height="40" rx="8" fill="#1f2558" stroke="#46509a"/><text x="455" y="285" fill="#fff" text-anchor="middle">"done"</text>
    <g stroke="#8b93b8" stroke-width="1.6" marker-end="url(#a)">
      <path d="M550 100 L 596 100"/><path d="M550 160 L 596 160"/><path d="M550 220 L 596 220"/><path d="M550 280 L 596 280"/>
    </g>
    <rect x="600" y="80" width="240" height="40" rx="8" fill="#183a3a" stroke="#3f8f86"/><text x="720" y="105" fill="#d9fff8" text-anchor="middle">answers it: decide and go</text>
    <rect x="600" y="140" width="240" height="40" rx="8" fill="#183a3a" stroke="#3f8f86"/><text x="720" y="165" fill="#d9fff8" text-anchor="middle">approves it, or refuses</text>
    <rect x="600" y="200" width="240" height="40" rx="8" fill="#183a3a" stroke="#3f8f86"/><text x="720" y="225" fill="#d9fff8" text-anchor="middle">nudges it</text>
    <rect x="600" y="260" width="240" height="40" rx="8" fill="#3a2d14" stroke="#c9a04a"/><text x="720" y="285" fill="#ffefc8" text-anchor="middle">reviews it against your goal</text>
  </g>
  <path d="M840 120 L 860 120 L 860 322 L 250 322 L 250 208" stroke="#7ad08f" stroke-width="1.6" fill="none" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="560" y="316" fill="#a9dcb7" font-size="12" text-anchor="middle">it keeps going</text>
</svg>
